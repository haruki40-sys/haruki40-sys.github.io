<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>함께 만든 기록</title>
<style>
@font-face{font-family:"CollectionRound";src:url("assets/fonts/NanumSquareRoundR.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}

:root{--ink:#173f5f;--muted:#6b7c86;--paper:#f8f9f6;--line:#dbe3e3;--teal:#257c76}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:92px}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.6 "CollectionRound","NanumSquareRound","Malgun Gothic",Arial,sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}a:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:5px}.wrap{width:min(1160px,calc(100% - 64px));margin:auto}
.top{position:sticky;top:0;z-index:5;background:rgba(248,249,246,.97);border-bottom:1px solid var(--line)}.bar{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:34px;height:34px;color:white;background:var(--ink);border-radius:11px;font-size:18px}.nav{display:flex;gap:8px}.nav a{padding:10px 18px;border-radius:30px;font-size:14px;font-weight:700}.nav a:hover{background:#e8eeeb}
.intro{padding:40px 0 28px;display:flex;align-items:baseline;justify-content:space-between}.intro h1{font-size:36px;letter-spacing:-2px;line-height:1.25;margin:0}.intro span{color:var(--muted);font-size:12px;letter-spacing:2px}
section{padding:20px 0 28px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.section-head h2{font-size:21px;margin:0;letter-spacing:-1px}.section-head span{font-size:11px;letter-spacing:2px;color:var(--muted)}.section-head:after{content:"";height:1px;background:var(--line);flex:1;margin-left:10px}
.grid{display:grid;gap:22px}.read-grid{grid-template-columns:repeat(3,1fr)}.view-grid{grid-template-columns:1.1fr 1fr}.tile{display:block;min-width:0}.art{position:relative;border-radius:14px;overflow:hidden;background:#e4e9e6}.art img{display:block;width:100%;height:100%;object-fit:cover}.read-grid .art{height:206px}.art:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #173f5f0b;border-radius:inherit;pointer-events:none}.caption{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:11px}.caption h3{font-size:17px;letter-spacing:-.6px;margin:0}.arrow{font-size:20px;color:var(--teal)}.tile:hover .caption h3{text-decoration:underline;text-underline-offset:5px}
.quote .art img{object-position:center 50%;filter:brightness(.57)}.quote-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,"Malgun Gothic",serif;font-size:28px;letter-spacing:-1px;line-height:1.7;text-align:center}.quote-text b{font-weight:400}.gallery-art{height:278px}.gallery-art img{object-position:center 44%}.polly-art{height:278px;background:#e2edf4;display:flex;align-items:center}.polly-art img{object-fit:contain;height:auto}.small{font-size:11px;font-weight:400;color:var(--muted);margin-left:8px}
.play-grid{grid-template-columns:1fr 1fr;align-items:start}.theater .art{height:250px}.office .art{height:250px}.office img{object-position:center 46%}.mystery{min-width:0;background:#eaf0ef;border-radius:16px;padding:18px}.mystery-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}.mystery h3{font-size:18px;margin:0}.mystery-head span{font-size:11px;color:var(--muted)}.cases{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cases .art{height:173px;border-radius:10px}.case-label{position:absolute;top:12px;left:12px;color:#fff;background:#16374eda;padding:4px 8px;border-radius:5px;font-size:10px;letter-spacing:1px}.cases .caption h4{font-size:14px;margin:0;letter-spacing:-.4px}.cases .caption{margin-top:9px}
footer{margin-top:20px;padding:24px 0 30px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer-row{display:flex;justify-content:space-between;align-items:flex-start}summary{cursor:pointer;padding:0 0 12px}.past{display:flex;gap:20px}.past a{display:inline-block;padding:8px 0}.past a:hover{text-decoration:underline}
@media(min-width:1500px){.wrap{width:1240px}.read-grid .art{height:222px}.gallery-art,.polly-art{height:300px}}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}.bar{height:64px}.brand{font-size:17px;gap:8px}.mark{width:29px;height:29px;font-size:16px}.nav{gap:0}.nav a{padding:10px;font-size:12px}.intro{padding:28px 0 16px}.intro h1{font-size:27px;letter-spacing:-1.5px}.intro span{display:none}section{padding:18px 0}.section-head h2{font-size:19px}.section-head span{font-size:9px}.grid{gap:14px}.read-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.read-grid .art{height:125px;border-radius:10px}.caption{margin-top:8px;gap:3px}.caption h3{font-size:12px;letter-spacing:-.5px}.arrow{font-size:16px}.quote-text{font-size:15px}.view-grid,.play-grid{grid-template-columns:1fr}.gallery-art{height:200px}.polly-art{height:auto}.polly-art img{width:100%;height:auto}.view-grid .caption h3,.office .caption h3{font-size:16px}.view-grid{gap:24px}.play-grid{gap:22px}.office .art,.theater .art{height:210px}.theater .caption h3{font-size:16px}.mystery{padding:14px}.cases{gap:12px}.cases .art{height:130px}.cases .caption h4{font-size:12px}.case-label{left:8px;top:8px;font-size:9px}.footer-row{gap:20px}.small{font-size:10px}.footer-row>span{font-size:10px}}
@media(max-width:360px){.wrap{width:calc(100% - 28px)}.nav a{padding:10px 7px}.read-grid{gap:10px}.read-grid .art{height:108px}.caption h3{font-size:11px}.read-grid .arrow{display:none}.cases .art{height:115px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>

</div></section>
